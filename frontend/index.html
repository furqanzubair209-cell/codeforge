<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0D10" />
    <meta name="description" content="CodeForge — sharpen your C++ and data structures & algorithms skills with a real compiler, curated problems, and progress tracking." />
    <title>CodeForge — C++ DSA Practice</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("codeforge:preferences");
          var theme = raw ? JSON.parse(raw).theme : "dark";
          if (theme === "light") document.documentElement.classList.add("light");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
